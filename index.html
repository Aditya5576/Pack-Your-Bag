<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pack Your Bags – Unified Travel Booking Platform</title>

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Pack Your Bags (BookMyTrip) is a modern travel booking platform. Instantly search, compare and book Bus, Train and Flight tickets in one clean unified web app."
    />
    <meta
      name="keywords"
      content="travel booking, bus tickets, train tickets, flight bookings, ticket portal, bookmytrip, pack your bags"
    />
    <meta name="author" content="Aditya Patil" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/mobile.css" />
  </head>
  <body>
    <!-- Premium Animated Splash Screen Loader -->
    <div id="splash-screen" class="splash-screen">
      <div class="splash-content">
        <div class="splash-logo-container">
          <svg class="brand-logo-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 6C10 4.34315 11.3431 3 13 3H19C20.6569 3 22 4.34315 22 6V8H26C27.6569 8 29 9.34315 29 11V25C29 27.2091 27.2091 29 25 29H7C4.79086 29 3 27.2091 3 25V11C3 9.34315 4.34315 8 6 8H10V6ZM12 6V8H20V6C20 5.44772 19.5523 5 19 5H13C12.4477 5 12 5.44772 12 6ZM8 12C7.44772 12 7 12.4477 7 13V24C7 24.5523 7.44772 25 8 25C8.55228 25 9 24.5523 9 24V13C9 12.4477 8.55228 12 8 12ZM24 12C23.4477 12 23 12.4477 23 13V24C23 24.5523 23.4477 25 24 25C24.5523 25 25 24.5523 25 24V13C25 12.4477 24.5523 12 24 12Z" fill="url(#splash-grad)" />
            <path d="M16 11C13.2386 11 11 13.2386 11 16C11 18.7614 13.2386 21 16 21C18.7614 21 21 18.7614 21 16C21 13.2386 18.7614 11 16 11ZM16 19.5C14.067 19.5 12.5 17.933 12.5 16C12.5 14.067 14.067 12.5 16 12.5C17.933 12.5 19.5 14.067 19.5 16C19.5 17.933 17.933 19.5 16 19.5Z" fill="url(#splash-grad)" />
            <path d="M5 23C10 21 22 21 27 23" stroke="url(#splash-grad)" stroke-width="2" stroke-linecap="round" />
            <defs>
              <linearGradient id="splash-grad" x1="3" y1="3" x2="29" y2="29" gradientUnits="userSpaceOnUse">
                <stop stop-color="#00f2fe" />
                <stop offset="1" stop-color="#4facfe" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="splash-brand">Pack Your Bags</h1>
        <p class="splash-tagline">Unified Travel Agent Companion</p>
        <div class="splash-loader-bar">
          <div class="splash-progress"></div>
        </div>
      </div>
    </div>

    <!-- Header Navigation Menu -->
    <header class="navbar-header">
      <div class="navbar-container container">
        <a href="#/" class="navbar-brand" style="display: flex; align-items: center; gap: 8px;">
          <img src="/images/brand_logo.png" alt="Pack Your Bags Logo" style="width: 32px; height: 32px; border-radius: 8px; box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);" />
          <span style="font-weight: 800; font-family: 'Outfit', sans-serif;">Pack Your Bags</span>
        </a>

        <!-- Hamburger button — visible on mobile only -->
        <button class="nav-toggle-btn" id="nav-hamburger" aria-label="Toggle navigation" style="display: none">
          <span></span><span></span><span></span>
        </button>

        <nav id="main-nav">
          <ul class="navbar-nav">
            <li><a href="#/" class="nav-link nav-home">Search Routes</a></li>
            <li><a href="#/my-trips" class="nav-link nav-trips">My Trips</a></li>
            <li><a href="#/profile" class="nav-link nav-profile">Profile</a></li>
            <!-- TODO: Restrict visibility of the Admin Dashboard navigation link to authorized administrators only in auth.js/app.js -->
            <li><a href="#/admin" class="nav-link nav-admin">Admin Dashboard</a></li>
            <li id="nav-auth-container" style="display: flex; align-items: center"></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Mounting Container for Single Page Application views -->
    <main id="app-view">
      <!-- View content is injected here dynamically -->
      <div class="view-loader">
        <div class="spinner"></div>
        <p>Starting travel agent console...</p>
      </div>
    </main>

    <!-- Footer Section -->
    <footer class="footer-section">
      <div class="container">
        <p>&copy; 2026 <strong>Pack Your Bags (BookMyTrip)</strong>. All rights reserved.</p>
        <p>Developed with ❤️ by <strong>Aditya Patil</strong></p>
      </div>
    </footer>

    <!-- External CDNs for Ticket Enhancements -->
    <!-- Canvas Confetti celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- QRCode generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- html2pdf generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Application Logic Scripts (Loaded Sequentially) -->
    <script src="js/supabaseConfig.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/mockData.js"></script>
    <script src="js/search.js"></script>
    <script src="js/booking.js"></script>
    <script src="js/hotels.js"></script>
    <script src="js/ticket.js"></script>
    <script src="js/hotelTicket.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
